<style>
:root{
  --bg:#0a0a0f;--surface:#16161d;--card:#1a1a24;--card-soft:#0d0d14;
  --text:#f5f5f7;--muted:rgba(245,245,247,0.68);--faint:rgba(245,245,247,0.58);
  --primary:#6366f1;--secondary:#ec4899;--tiffany:#0ABAB5;
  --border:rgba(255,255,255,0.07);--border-mid:rgba(255,255,255,0.13);
  --font:'Plus Jakarta Sans',sans-serif;--mono:'Space Mono',monospace;
  --ease:0.4s cubic-bezier(0.4,0,0.2,1);--bounce:0.5s cubic-bezier(0.34,1.56,.64,1);
}
[data-theme="light"]{
  --bg:#f4f4f8;--surface:#ffffff;--card:#ffffff;--card-soft:#ececf4;
  --text:#0a0a0f;--muted:rgba(10,10,15,0.72);--faint:rgba(10,10,15,0.64);
  --border:rgba(0,0,0,0.07);--border-mid:rgba(0,0,0,0.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.65;transition:background var(--ease),color var(--ease)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}
.skip{position:fixed;top:-100px;left:16px;z-index:9999;padding:12px 20px;background:var(--primary);color:#fff;border-radius:8px;font-weight:700;font-size:14px;transition:top .2s}
.skip:focus{top:16px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:68px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-mid);background:rgba(10,10,15,0.92);box-shadow:0 4px 24px rgba(0,0,0,.2);transition:background var(--ease)}
[data-theme="light"] .nav{background:rgba(248,248,252,0.94)}
.nav__inner{max-width:1280px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
@media(min-width:768px){.nav__inner{padding:0 48px}}
.nav__back{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);transition:color var(--ease)}
.nav__back:hover{color:var(--text)}
.nav__back svg{width:16px;height:16px;transition:transform var(--ease)}
.nav__back:hover svg{transform:translateX(-3px)}
.nav__right{display:flex;align-items:center;gap:12px}
.lang-sep{color:var(--faint);font-size:11px}
.lang-btn{font-family:var(--mono);font-size:11px;background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:6px;font-weight:400;color:var(--faint);transition:color .3s,font-weight .3s,background .3s;letter-spacing:.05em}
.lang-btn[aria-pressed="true"]{color:var(--primary);font-weight:800;background:rgba(99,102,241,0.14)}
[data-theme="light"] .lang-btn[aria-pressed="true"]{background:rgba(79,70,229,0.10)}
.lang-btn:hover:not([aria-pressed="true"]){color:var(--text);background:rgba(255,255,255,0.06)}
[data-theme="light"] .lang-btn:hover:not([aria-pressed="true"]){background:rgba(0,0,0,0.05)}
.theme-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-mid);color:var(--muted);transition:background var(--ease),transform var(--bounce),border-color var(--ease),color var(--ease)}
.theme-btn:hover{background:var(--surface);transform:rotate(20deg);color:var(--text)}
[data-theme="light"] .theme-btn{background:rgba(79,70,229,0.10);border-color:var(--primary);color:var(--primary)}
[data-theme="light"] .theme-btn:hover{background:var(--primary);color:#fff}
.theme-btn svg{width:16px;height:16px}

/* HERO / HEADER */
.g-header{padding:140px 24px 48px;max-width:1280px;margin:0 auto}
@media(min-width:768px){.g-header{padding:150px 48px 56px}}
.g-eyebrow{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--primary);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.g-eyebrow::before{content:'';width:32px;height:1px;background:var(--primary)}
.g-title{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:16px}
.g-desc{font-size:16px;color:var(--muted);max-width:560px;line-height:1.7}

/* FILTERS — sticky bar, orden claro */
.g-filters-bar{position:sticky;top:68px;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px;transition:background var(--ease)}
@media(min-width:768px){.g-filters-bar{padding:18px 48px}}
.g-filters{display:flex;flex-wrap:wrap;gap:8px;max-width:1280px;margin:0 auto}
.g-filter-btn{padding:9px 18px;border-radius:100px;border:1px solid var(--border-mid);background:var(--card-soft);color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;transition:all var(--ease);white-space:nowrap}
.g-filter-btn:hover{border-color:var(--primary);color:var(--text)}
.g-filter-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.g-count{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;align-self:center;padding-left:12px;white-space:nowrap}

/* GALERÍA — masonry real vía CSS columns: cada imagen conserva su
   proporción natural (sin recortar), y como cada columna fluye de forma
   independiente y continua, nunca quedan huecos feos entre piezas. */
.g-wrap{max-width:1400px;margin:0 auto;padding:32px 24px 100px}
@media(min-width:768px){.g-wrap{padding:40px 48px 120px}}
.g-grid{column-count:2;column-gap:14px}
@media(min-width:560px){.g-grid{column-count:3;column-gap:16px}}
@media(min-width:900px){.g-grid{column-count:4}}
@media(min-width:1400px){.g-grid{column-count:5}}

.g-item{
  position:relative;display:block;width:100%;
  break-inside:avoid;-webkit-column-break-inside:avoid;
  margin:0 0 14px;border-radius:14px;overflow:hidden;
  border:1px solid var(--border);background:var(--card-soft);
  cursor:pointer;
  opacity:0;transform:translateY(14px) scale(.98);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,border-color .3s ease;
}
@media(min-width:560px){.g-item{margin-bottom:16px}}
.g-item.visible{animation:gIn .55s ease forwards}
@keyframes gIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.g-item{opacity:1;transform:none;animation:none!important}}
.g-item:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.32);border-color:var(--border-mid);z-index:2}
.g-item img,.g-item video{width:100%;height:auto;display:block;transition:transform .5s ease}
.g-item:hover img,.g-item:hover video{transform:scale(1.035)}
/* Sin overlay de texto en el grid — solo la imagen, minimalista */

/* REELS */
.g-item--reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.g-item__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform var(--ease),background var(--ease)}
.g-item--reel:hover .g-item__play{transform:translate(-50%,-50%) scale(1.1);background:rgba(255,255,255,.28)}
.g-item__play svg{width:18px;height:18px;fill:#fff;margin-left:2px}
.g-item__reel-tag{position:absolute;bottom:10px;left:10px;z-index:2;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);padding:4px 9px;border-radius:100px}

/* EMPTY STATE */
.g-empty{column-span:all;text-align:center;padding:80px 0;color:var(--muted);font-size:14px}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:40px 24px;backdrop-filter:blur(8px)}
.lightbox.open{display:flex}
.lightbox__img{max-width:100%;max-height:85vh;border-radius:12px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.lightbox__video{max-width:100%;max-height:85vh;border-radius:12px;box-shadow:0 40px 100px rgba(0,0,0,.6);background:#000}
.lightbox__close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;transition:all var(--ease)}
.lightbox__close:hover{background:rgba(255,255,255,.18);transform:rotate(90deg)}
.lightbox__close svg{width:18px;height:18px}
.lightbox__caption{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);text-align:center;color:rgba(255,255,255,.7);font-family:var(--mono);font-size:11px;letter-spacing:.05em}

footer{padding:32px 24px;border-top:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const T = {
  es:{ skip:"Saltar al contenido", back:"Volver al portfolio",
       eyebrow:"Archivo Visual", title:"Trabajo Gráfico",
       desc:"Un vistazo completo a las piezas que he diseñado: identidad de marca, social media, publicidad, reels y branding para distintas industrias.",
       f_all:"Todas", f_reels:"Reels", footer:"Diseñadora Multidisciplinar" },
  en:{ skip:"Skip to content", back:"Back to portfolio",
       eyebrow:"Visual Archive", title:"Graphic Work",
       desc:"A full look at the pieces I've designed: brand identity, social media, advertising, reels and branding across different industries.",
       f_all:"All", f_reels:"Reels", footer:"Multidisciplinary Designer" }
};

let lang="es";
let currentBrand="all";

function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k=el.getAttribute("data-t");
    if(T[l][k]!==undefined)el.textContent=T[l][k];
  });
  document.getElementById("btn-es").setAttribute("aria-pressed",l==="es"?"true":"false");
  document.getElementById("btn-en").setAttribute("aria-pressed",l==="en"?"true":"false");
  renderGrid();
  buildFilters();
}

function toggleTheme(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("va-theme",next);
  syncIcons();
}

function syncIcons(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("icon-moon").style.display=dark?"block":"none";
  document.getElementById("icon-sun").style.display=dark?"none":"block";
}

/* ── GRID limpio y ordenado (no masonry) ──────────────────
   Tiles de tamaño uniforme (aspect-ratio 4/5, object-fit:cover),
   en columnas fijas que se adaptan al ancho de pantalla. */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = currentBrand === 'all'
    ? PIECES
    : currentBrand === 'reels'
      ? PIECES.filter(p => p.type === 'reel')
      : PIECES.filter(p => p.brand === currentBrand);

  document.getElementById('g-count').textContent =
    `${filtered.length} ${lang==='es' ? 'piezas' : 'pieces'}`;

  if (filtered.length === 0){
    grid.innerHTML = `<p class="g-empty">${lang==='es' ? 'No hay piezas en esta categoría todavía.' : 'No pieces in this category yet.'}</p>`;
    return;
  }

  filtered.forEach((piece, idx) => {
    const item = document.createElement('figure');
    item.className = piece.type === 'reel' ? 'g-item g-item--reel' : 'g-item';
    item.style.transitionDelay = `${(idx % 10) * 0.04}s`;
    item.setAttribute('data-brand', piece.brand || 'independent');

    const typeLabel = piece.brand ? (lang === 'es' ? piece.typeEs : piece.typeEn) : '';
    const caption = piece.brand ? `${piece.nameEs} — ${typeLabel}` : '';
    const altText = piece.brand ? `${piece.nameEs} — ${typeLabel}` : (piece.type==='reel' ? 'Reel' : 'Trabajo gráfico independiente');

    if (piece.type === 'reel') {
      item.onclick = () => openLightbox(piece.src, caption, true);
      item.innerHTML = `
        <img src="${piece.poster}" alt="${altText}" loading="lazy"
             onerror="this.closest('.g-item').style.display='none'">
        <span class="g-item__reel-tag">Reel</span>
        <span class="g-item__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>`;
    } else {
      item.onclick = () => openLightbox(piece.src, caption, false);
      item.innerHTML = `
        <img src="${piece.src}" alt="${altText}" loading="lazy"
             onerror="this.closest('.g-item').style.display='none'">`;
    }

    grid.appendChild(item);
  });

  observeReveal();
}

function openLightbox(src, caption, isVideo){
  const img = document.getElementById('lightbox-img');
  const vid = document.getElementById('lightbox-video');
  if (isVideo) {
    img.style.display = 'none'; img.src = '';
    vid.style.display = 'block';
    vid.src = src;
    vid.play().catch(()=>{});
  } else {
    vid.style.display = 'none'; vid.pause(); vid.removeAttribute('src'); vid.load();
    img.style.display = 'block';
    img.src = src;
  }
  document.getElementById('lightbox-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  const vid = document.getElementById('lightbox-video');
  vid.pause();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeLightbox();
});

function observeReveal(){
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, {threshold:0.08});

  document.querySelectorAll('.g-item:not(.visible)').forEach(el=>io.observe(el));
}

/* Filters — se generan desde las marcas presentes en PIECES, + "Reels" si hay alguno */
function buildFilters(){
  const container = document.getElementById('g-filters');
  const countEl = document.getElementById('g-count');
  container.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'g-filter-btn';
  allBtn.dataset.brand = 'all';
  allBtn.setAttribute('aria-pressed', currentBrand === 'all' ? 'true' : 'false');
  allBtn.textContent = T[lang].f_all;
  allBtn.onclick = () => selectFilter('all');
  container.appendChild(allBtn);

  const seen = new Set();
  PIECES.forEach(p => {
    if (!p.brand) return;
    if (!seen.has(p.brand)) {
      seen.add(p.brand);
      const btn = document.createElement('button');
      btn.className = 'g-filter-btn';
      btn.dataset.brand = p.brand;
      btn.setAttribute('aria-pressed', currentBrand === p.brand ? 'true' : 'false');
      btn.textContent = p.nameEs;
      btn.onclick = () => selectFilter(p.brand);
      container.appendChild(btn);
    }
  });

  if (PIECES.some(p => p.type === 'reel')) {
    const reelBtn = document.createElement('button');
    reelBtn.className = 'g-filter-btn';
    reelBtn.dataset.brand = 'reels';
    reelBtn.setAttribute('aria-pressed', currentBrand === 'reels' ? 'true' : 'false');
    reelBtn.textContent = T[lang].f_reels;
    reelBtn.onclick = () => selectFilter('reels');
    container.appendChild(reelBtn);
  }

  container.appendChild(countEl);
}

function selectFilter(brand){
  currentBrand = brand;
  document.querySelectorAll('.g-filter-btn').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.brand === brand ? 'true' : 'false');
  });
  renderGrid();
}

syncIcons();
buildFilters();
setLang('es');
