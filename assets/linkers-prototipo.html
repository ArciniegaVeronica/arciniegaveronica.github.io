<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkers Web Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop sidebar app shell (1440) → icon rail (1024) → compact header + bottom nav (390). Landing is an editorial marketing page outside the shell. */
:root{
  color-scheme:light;
  --paper:#F6F7FB; --surface:#FFFFFF; --sunk:#ECEEF5; --ink:#1F2160; --ink-2:#4A4D72; --ink-3:#62658A; --line:#DADDEA; --line-2:#7E819E;
  --cobalt:#37419E; --cobalt-d:#262E7A; --cobalt-l:#E6E8F6; --cobalt-m:#C3C8EC; --sky:#8EC5F5; --sky-l:#DCEEFD; --bulb:#F6C445;
  --ok:#1F7A55; --ok-l:#E2F2EA; --hi:#A34700; --hi-l:#FCE9DA; --med:#7A5C00; --med-l:#F7EFCF; --bad:#B3261E; --bad-l:#FBE5E3; --low:#4F5168; --low-l:#ECEEF5;
  --display:"Montserrat",system-ui,sans-serif;
  --sans:"Montserrat",system-ui,sans-serif; --legible:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r-s:6px;--r-m:10px;--r-l:14px;
  --sh-1:0 1px 2px rgba(22,23,58,.06);--sh-2:0 8px 24px -12px rgba(22,23,58,.22);--sh-3:0 24px 48px -20px rgba(22,23,58,.35);
  --focus:0 0 0 2px var(--surface),0 0 0 5px var(--cobalt);
  --fs:16px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;font-size:1rem;line-height:1.6;font-weight:500}
html.legible body{font-family:var(--legible)}html.legible .disp{font-family:var(--legible)}
html.hc{--line:#8D91B0;--line-2:#62658A;--ink-2:#2E3159;--ink-3:#3F4268}
a{color:var(--cobalt);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-s);z-index:99}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.12}
.eyebrow{font:700 .75rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt)}
.muted{color:var(--ink-2)}.small{font-size:.875rem}.xs{font-size:.78rem}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-m);border:1.5px solid transparent;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--cobalt);color:#fff}.btn-p:hover,.btn-p.is-hover{background:var(--cobalt-d)}.btn-p:active,.btn-p.is-active{background:#151862}
.btn-s{background:var(--surface);color:var(--cobalt);border-color:var(--cobalt)}.btn-s:hover,.btn-s.is-hover{background:var(--cobalt-l)}
.btn-g{background:transparent;color:var(--ink)}.btn-g:hover,.btn-g.is-hover{background:var(--sunk)}
.btn[disabled],.btn.is-disabled{background:var(--sunk);color:#8d8e9e;border-color:var(--sunk);cursor:not-allowed}
.btn.is-focus{box-shadow:var(--focus)}
.btn.is-error{background:var(--bad);color:#fff}.btn.is-success{background:var(--ok);color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:.85rem}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s5)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:var(--s4)}
.card-h h2,.card-h h3{font-size:1.05rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--cobalt-l);color:var(--cobalt-d);white-space:nowrap}
.pill svg{width:14px;height:14px}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:var(--r-s);letter-spacing:.02em}
.sev-critical{background:var(--bad-l);color:var(--bad)}.sev-high{background:var(--hi-l);color:var(--hi)}.sev-medium{background:var(--med-l);color:var(--med)}.sev-low{background:var(--low-l);color:var(--low)}
.sev-ok{background:var(--ok-l);color:var(--ok)}
.sev i{font-style:normal;font-size:.9em}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cobalt);border-radius:inherit}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--cobalt-l);color:var(--cobalt-d);flex:none}
.av.lg{width:72px;height:72px;font-size:1.4rem}
.av.c2{background:var(--ok-l);color:var(--ok)}.av.c3{background:var(--hi-l);color:var(--hi)}.av.c4{background:var(--med-l);color:var(--med)}.av.c5{background:var(--sunk);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{min-height:44px;border:1.5px solid var(--line-2);border-radius:var(--r-m);padding:0 14px;background:var(--surface);width:100%}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical}
.input:hover{border-color:var(--ink-3)}.input:focus-visible{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-m);border-radius:var(--r-m)}
.input.is-error{border-color:var(--bad)}.input.is-success{border-color:var(--ok)}.input[disabled]{background:var(--sunk);color:#8d8e9e}
.help{font-size:.82rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}.help.err{color:var(--bad);font-weight:700}.help.okk{color:var(--ok);font-weight:700}
.search{position:relative}.search .ico{position:absolute;left:14px;top:12px;color:var(--ink-3)}.search .input{padding-left:44px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:12px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--cobalt);border-color:var(--cobalt)}
.tab:hover{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:0 14px;min-height:36px;font-weight:600;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"]::before{content:"✓"}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-m);border:1px solid;align-items:flex-start}
.alert .ico{margin-top:2px}
.alert-info{background:var(--cobalt-l);border-color:var(--cobalt-m);color:var(--cobalt-d)}
.alert-ok{background:var(--ok-l);border-color:#b9dcc9;color:var(--ok)}
.alert-err{background:var(--bad-l);border-color:#f0c2be;color:var(--bad)}
.alert-warn{background:var(--hi-l);border-color:#f3cfb3;color:var(--hi)}
.alert b{display:block;color:inherit}.alert p{margin:2px 0 0;color:var(--ink)}
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line-2);border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:var(--sh-1)}
.switch[aria-checked="true"]{background:var(--cobalt)}.switch[aria-checked="true"]::after{left:23px}
.tip{position:relative;display:inline-block}
.tip-b{background:var(--ink);color:#fff;font-size:.8rem;padding:8px 10px;border-radius:var(--r-s);max-width:220px;box-shadow:var(--sh-2)}
.score{position:relative;display:grid;place-items:center}
.score svg{transform:rotate(-90deg)}
.score b{position:absolute;font-size:1.6rem;font-weight:800}
.score.lg b{font-size:2.4rem}
.score small{position:absolute;bottom:22%;font-size:.7rem;color:var(--ink-2);font-weight:700}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.g{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g>*{min-width:0}
.kpi .n{font-size:2rem;font-weight:800;line-height:1.1}
.kpi .l{font-size:.85rem;color:var(--ink-2)}
.mark{width:36px;height:22px;flex:none}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:6px 10px 22px;text-decoration:none;color:var(--ink)}
.nav-l{font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:var(--r-m);text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.95rem;position:relative}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--cobalt-l);color:var(--cobalt-d)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--cobalt)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:.72rem;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 32px}
.topbar .search{flex:1;max-width:460px}
.content{padding:32px;max-width:1240px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.ph h1{font-size:clamp(1.6rem,2.4vw,2.1rem)!important}
.ph p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;color:var(--ink-2);padding:0 12px;min-height:32px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.78rem;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mhead,.bnav{display:none}

@media (max-width:1180px){
  .shell{grid-template-columns:76px minmax(0,1fr)}
  .side{padding:16px 10px;align-items:center}
  .side .lbl,.side .nav-l,.logo span,.side .nav .badge{display:none}
  .logo{padding:6px 0 18px}
  .side .nav{justify-content:center;width:52px;padding:0}
  .side .nav[aria-current="page"]::before{left:-10px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .shell{display:block}
  .side,.topbar{display:none}
  .mhead{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:12px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--ink-2);text-decoration:none;min-height:48px;justify-content:center;border-radius:var(--r-m)}
  .bnav a[aria-current="page"]{color:var(--cobalt)}
  .bnav a[aria-current="page"] .ico{stroke-width:2.4}
  .content{padding:20px 16px 100px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:18px}
}

/* ---------- landing ---------- */
.lnd{background:var(--paper)}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,56px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.lnav nav{display:flex;gap:26px}.lnav nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.lw{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,4vw,56px)}
.lhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center;padding-block:72px 64px}
.lhero h1{font-size:clamp(2.4rem,4.4vw,3.9rem)}
.lhero h1 em{color:var(--cobalt)}
.lhero p{font-size:1.2rem;color:var(--ink-2);max-width:40ch;margin:24px 0 32px}
.join{position:relative;aspect-ratio:1.15/1;max-width:100%}
.piece{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-2);padding:20px;display:flex;flex-direction:column;gap:12px}
.lsec{padding-block:96px;border-top:1px solid var(--line)}
.lsec h2{font-size:clamp(1.8rem,3vw,2.6rem)}
.feat{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:center}
.feat.rev{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.feat.rev>:first-child{order:2}
.feat p{color:var(--ink-2);font-size:1.08rem;max-width:44ch}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-2);padding:22px;overflow:hidden}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.steps>div{padding:28px;border-right:1px solid var(--line)}.steps>div:last-child{border:0}
.steps b{font-size:2.6rem;color:var(--cobalt);font-weight:800;line-height:1}
.cta-band{background:var(--cobalt);color:#fff;border-radius:var(--r-l);padding:clamp(32px,6vw,72px);display:grid;grid-template-columns:minmax(0,1.3fr) auto;gap:32px;align-items:center}
.cta-band h2{color:#fff}
.cta-band .btn-p{background:#fff;color:var(--cobalt)}
.cta-band .btn-p:hover{background:var(--cobalt-l)}
.cta-band :focus-visible{box-shadow:0 0 0 2px var(--cobalt),0 0 0 5px #fff}
.lfoot{padding-block:40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem}
@media (max-width:960px){.lhero,.feat,.feat.rev{grid-template-columns:1fr}.feat.rev>:first-child{order:0}.steps{grid-template-columns:1fr 1fr}.steps>div:nth-child(2){border-right:0}.steps>div:nth-child(-n+2){border-bottom:1px solid var(--line)}.cta-band{grid-template-columns:1fr}.lnav nav{display:none}}
@media (max-width:560px){.steps{grid-template-columns:1fr}.steps>div{border-right:0;border-bottom:1px solid var(--line)}.join{aspect-ratio:auto;display:flex;flex-direction:column;gap:14px}.join .piece{position:static;width:auto!important}.join svg.conn{display:none}}

/* ---------- specific ---------- */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.demo>div{border-radius:var(--r-m);padding:18px;border:1px solid var(--line)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line-2);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;background:var(--surface);min-height:52px;text-align:left;width:100%}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-checked="true"]{border-color:var(--cobalt);background:var(--cobalt-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{border-color:var(--cobalt)}.opt[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cobalt)}
.issue{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.issue>button{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:none;border:0;cursor:pointer;text-align:left;min-height:60px}
.issue>button .chev{margin-left:auto;transition:transform .2s}
.issue>button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.issue .body{padding:0 18px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.issue .body h3{font-size:.78rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.issue .body p{margin:0}
.drop{border:2px dashed var(--line-2);border-radius:var(--r-l);padding:28px;text-align:center;background:var(--surface)}
.canvas{background:var(--sunk);border-radius:var(--r-m);padding:22px;position:relative}
.canvas .scr{background:#fff;border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto;box-shadow:var(--sh-2)}
.ln{height:10px;border-radius:99px;background:#D7D6D0}
.pin{position:absolute;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl>div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl>div::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl>div:last-child::before{display:none}
.tl .nd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--sunk);color:var(--ink-2);border:2px solid var(--line-2)}
.tl .nd.done{background:var(--ok);color:#fff;border-color:var(--ok)}.tl .nd.now{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.sess{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:20px;align-items:start}
.taskb{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-m);border:1.5px solid transparent;background:none;width:100%;text-align:left;cursor:pointer}
.taskb[aria-current="step"]{border-color:var(--cobalt);background:var(--cobalt-l)}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;color:#fff;font-size:.8rem;font-weight:800;margin-top:1px}
.cb.on{background:var(--ok);border-color:var(--ok)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--bad);font-size:.85rem}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.live::before{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.35}}
.quote{font-style:italic;font-weight:600;font-size:1.25rem;line-height:1.4}
.ds-sw{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.ds-sw>div:first-child{height:84px}

.hb-kick{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.8rem;letter-spacing:.04em}.hb-kick i{width:8px;height:8px;border-radius:50%;background:var(--sky)}
.hb-h1{font-weight:800;font-size:clamp(2.5rem,5vw,4.4rem);line-height:1.04;letter-spacing:-.03em;margin:22px 0 0;color:#fff}.hb-h1 span{color:var(--sky)}
.hb-lede{font-size:1.15rem;max-width:44ch;margin:22px 0 32px;color:#fff}
.hb-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hb-btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;border:2px solid #fff;transition:background .15s}
.hb-btn .ico{width:18px;height:18px}.hb-w{background:#fff;color:var(--cobalt)}.hb-w:hover{background:var(--cobalt-l)}.hb-o{color:#fff}.hb-o:hover{background:rgba(255,255,255,.12)}
.hb :focus-visible{box-shadow:0 0 0 2px var(--cobalt),0 0 0 5px #fff;border-radius:12px}
.hb-roles{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:34px 0 0;max-width:560px}
.hb-roles li{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:.86rem}
.hb-roles b{display:block;font-size:.95rem}.hb-sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.hb-stage{position:relative;min-width:0}
.hb-browser{background:#fff;border-radius:16px;box-shadow:0 40px 80px -30px rgba(10,12,50,.6),0 0 0 1px rgba(255,255,255,.3);overflow:hidden;color:var(--ink);font-size:13px}
.hb-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#EEF0F7;border-bottom:1px solid var(--line)}.hb-bar>i{width:10px;height:10px;border-radius:50%;background:#C9CCDD}
.hb-url{margin-left:12px;flex:1;background:#fff;border-radius:8px;padding:4px 12px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}.hb-url .ico{width:12px;height:12px}
.hb-app{display:grid;grid-template-columns:140px minmax(0,1fr);min-height:340px}
.hb-side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}.hb-side>div{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-weight:700;color:var(--ink-2);font-size:12px}.hb-side>div.on{background:var(--cobalt);color:#fff}.hb-side .ico{width:15px;height:15px}
.hb-main{min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.hb-ban{background:var(--cobalt);color:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hb-ban b{font-size:16px;display:block}.hb-ban small{font-size:11px}.hb-ban>span{background:#fff;color:var(--cobalt);border-radius:8px;padding:6px 10px;font-weight:700;font-size:11px;white-space:nowrap}
.hb-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.hb-steps>div{min-width:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 5px;font-size:9.5px;font-weight:700}
.hb-steps span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;margin-bottom:4px;background:var(--cobalt-l);color:var(--cobalt-d)}.hb-steps .d span{background:var(--ok);color:#fff}.hb-steps .c{border-color:var(--cobalt);background:var(--cobalt-l)}.hb-steps .c span{background:var(--cobalt);color:#fff}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px}.hb-mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}.hb-mini.col{flex-direction:column;align-items:stretch;gap:6px}.hb-up{color:var(--ok);font-weight:700;font-size:12px}
.hb-bars{display:flex;align-items:flex-end;gap:5px;height:56px}.hb-bars i{flex:1;background:var(--cobalt);border-radius:3px 3px 0 0}.hb-bars i:last-child{background:var(--cobalt-d)}
.hb-f1{position:absolute;left:-48px;bottom:-118px;width:300px;background:#fff;color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 30px 60px -24px rgba(10,12,50,.55);display:flex;flex-direction:column;gap:10px;z-index:3}.hb-f1 p{margin:0;font-weight:600;font-style:italic;line-height:1.45}.hb-f1 .sev{align-self:flex-start}
.hb-f2{position:absolute;right:-20px;top:-26px;background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 20px 40px -20px rgba(10,12,50,.5);display:flex;align-items:center;gap:10px;z-index:3;font-size:.85rem}.hb-f2 small{display:block;font-size:.75rem;color:var(--ink-2)}.hb-f2>span{width:30px;height:30px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:grid;place-items:center}.hb-f2 .ico{width:16px;height:16px}
.hb-strip{position:relative;z-index:4;margin-top:-70px}
.hb-trust{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 40px -28px rgba(31,33,96,.45);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.hb-trust li{padding:clamp(16px,2vw,24px) clamp(16px,2.2vw,28px);border-right:1px solid var(--line)}.hb-trust li:last-child{border-right:0}
.hb-trust b{display:block;font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;color:var(--cobalt);line-height:1.1;font-variant-numeric:tabular-nums}.hb-trust span{font-size:.88rem;color:var(--ink-2)}
@media (max-width:1100px){.hb-grid{grid-template-columns:1fr}.hb-stage{max-width:720px;margin:20px auto 0;width:100%}.hb-f1{left:-8px}}
@media (max-width:860px){.hb-trust{grid-template-columns:1fr 1fr}.hb-trust li:nth-child(2){border-right:0}.hb-trust li:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:600px){.hb-roles{grid-template-columns:1fr}.hb-app{grid-template-columns:1fr}.hb-side{display:none}.hb-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.hb-row{grid-template-columns:1fr}.hb-f1{position:relative;left:auto;bottom:auto;width:auto;margin:-30px 12px 0}.hb-f2{right:8px;top:-18px}.hb{padding-bottom:110px}}
@media (prefers-reduced-motion:no-preference){html:not(.rm) .hb-f1{animation:hbup .8s .2s cubic-bezier(.2,.7,.2,1) both}html:not(.rm) .hb-f2{animation:hbup .8s .35s cubic-bezier(.2,.7,.2,1) both}}
@keyframes hbup{from{transform:translateY(14px)}to{transform:none}}
</style>

/* ===== render & events ===== */
const app=document.getElementById("app"),layer=document.getElementById("layer");
function render(focus){
  document.documentElement.lang=S.lang;
  document.getElementById("skip").textContent=L("Skip to content","Saltar al contenido");
  app.innerHTML=(V[S.route]||V.landing)()+a11yFab();app.querySelectorAll('[style*="overflow-x:auto"],.tslots').forEach(el=>{if(el.scrollWidth>el.clientWidth+1){el.tabIndex=0;el.setAttribute("role","region");el.setAttribute("aria-label",L("Scrollable content","Contenido desplazable"))}});
  if(focus){const m=document.getElementById("main");m&&m.focus({preventScroll:true});window.scrollTo(0,0)}
}
function a11yFab(){const sw=(k,t)=>`<div class="row between" style="gap:16px;padding:8px 0"><span id="fab-${k}" class="small" style="font-weight:700">${t}</span><button class="switch" role="switch" aria-checked="${S.set[k]}" aria-labelledby="fab-${k}" data-sw="${k}"></button></div>`;
 return `<div class="fab"><button class="fab-b" aria-expanded="${S.a11y}" aria-controls="fab-p" data-act="a11y" aria-label="${L("Accessibility options","Opciones de accesibilidad")}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true" style="width:26px;height:26px"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7" r="1.4" fill="currentColor"/><path d="M7 10l5 1 5-1M12 11v4l-2.5 4M12 15l2.5 4"/></svg></button>${S.a11y?`<div id="fab-p" class="card fab-p" role="region" aria-label="${L("Accessibility","Accesibilidad")}"><h2 style="font-size:1rem;margin-bottom:6px">${L("Accessibility","Accesibilidad")}</h2>${sw("large",L("Larger text","Texto más grande"))}${sw("legible",L("High-legibility font","Fuente de alta legibilidad"))}${sw("hc",L("Higher contrast","Más contraste"))}${sw("legible",L("High-legibility font","Fuente de alta legibilidad"),L("Switches to Atkinson Hyperlegible, designed for low vision.","Cambia a Atkinson Hyperlegible, diseñada para baja visión."))}${sw("hc",L("Higher contrast","Más contraste"),L("Darker borders and secondary text.","Bordes y texto secundario más oscuros."))}${sw("rm",L("Reduce motion","Reducir movimiento"))}</div>`:""}</div>`}
function go(){const h=location.hash.slice(1);if(layer.querySelector(".modal-bg"))layer.innerHTML="";if(h==="logout"){S.role="designer";S.logged=false;S.a11y=false;history.replaceState(null,"","#landing");S.route="landing";render(true);toast(L("You have logged out","Has cerrado sesión"));return}if(h.startsWith("l-")){if(S.route!=="landing"||!app.innerHTML){S.route="landing";render()}document.getElementById(h)?.scrollIntoView();return}S.route=V[h]?h:"landing";if(S.route!=="createtest"&&S.ct.step===3){S.ct=Object.assign({},S.ct,{step:1,type:null,name:"",desc:"",q:"",err:false,err2:false});S.ctDates=new Set();S.ctTimes=new Set()}render(true);speak()}

window.addEventListener("hashchange",go);
function toast(t){layer.innerHTML=`<div class="toast" role="status">${I("ok")} ${t}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>layer.innerHTML="",2800)}
let lastF=null;
function modal(title,html,actions){lastF=document.activeElement;layer.innerHTML=`<div class="modal-bg"><div class="modal stack" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh" style="font-size:1.3rem">${title}</h2>${html}<div class="row" style="justify-content:flex-end;flex-wrap:wrap">${actions}</div></div></div>`;(layer.querySelector(".modal input,.modal select,.modal button")||layer.querySelector(".modal")).focus()}
function closeModal(){layer.innerHTML="";lastF&&document.body.contains(lastF)&&lastF.focus()}
function projModal(){modal(L("New project","Nuevo proyecto"),`<div class="field"><label for="mn">${L("Project name","Nombre del proyecto")} *</label><input id="mn" class="input" placeholder="${L("e.g. Museum audio guide","p. ej. Audioguía del museo")}" aria-describedby="mn-e"><span id="mn-e" class="help"></span></div><div class="field"><label for="mt">${L("Target standard","Estándar objetivo")}</label><select id="mt" class="input"><option>WCAG 2.2 AA</option><option>WCAG 2.2 AAA</option></select></div>`,`<button class="btn btn-g" data-close>${L("Cancel","Cancelar")}</button><button class="btn btn-p" data-act="mk-project">${L("Create project","Crear proyecto")}</button>`)}
function invModal(n){const days=[L("Wed 7 Oct","Mié 7 oct"),L("Thu 8 Oct","Jue 8 oct"),L("Fri 9 Oct","Vie 9 oct"),L("Mon 12 Oct","Lun 12 oct")];modal(L(`Invite ${n} to test`,`Invitar a ${n} a testear`),`<div class="field"><label for="iv-p">${L("Project","Proyecto")}</label><select id="iv-p" class="input">${PROJECTS().map(p=>`<option>${p.n}</option>`).join("")}</select></div><div class="g g2" style="gap:12px"><div class="field"><label for="iv-d">${L("Date","Fecha")}</label><select id="iv-d" class="input">${days.map(d=>`<option>${d}</option>`).join("")}</select></div><div class="field"><label for="iv-t">${L("Time","Hora")}</label><select id="iv-t" class="input"><option>10:00</option><option>11:00</option><option>16:30</option><option>18:00</option></select></div></div><div class="field"><label for="iv-m">${L("Message (optional)","Mensaje (opcional)")}</label><textarea id="iv-m" class="input">${L("Hi! I would love your feedback on our booking flow.","¡Hola! Me encantaría tu opinión sobre nuestro flujo de reserva.")}</textarea></div><div class="alert alert-info">${I("info")}<div><b>${L("45 min · remote · 10 pts","45 min · remoto · 10 pts")}</b><p class="small">${L(`${n} earns the points after the session, even if tasks fail.`,`${n} gana los puntos tras la sesión, aunque las tareas fallen.`)}</p></div></div>`,`<button class="btn btn-g" data-close>${L("Cancel","Cancelar")}</button><button class="btn btn-p" data-act="send-invite" data-who="${n}">${L("Send invitation","Enviar invitación")}</button>`)}
function endModal(){modal(L("End session?","¿Terminar la sesión?"),`<div class="g keep" style="gap:10px;grid-template-columns:repeat(3,1fr)">${[[S.done.size+"/4",L("tasks","tareas")],[3+S.issues.length,L("issues","problemas")],["18:42",L("duration","duración")]].map(k=>`<div class="card kpi" style="padding:14px;text-align:center"><div class="n num" style="font-size:1.5rem">${k[0]}</div><div class="l">${k[1]}</div></div>`).join("")}</div><p class="small" style="margin:0">${L("Javier will receive 10 points and a thank-you note. Your notes are saved in Feedback.","Javier recibirá 10 puntos y una nota de agradecimiento. Tus notas se guardan en Feedback.")}</p>`,`<button class="btn btn-g" data-close>${L("Keep testing","Seguir en la sesión")}</button><button class="btn btn-p" data-act="end-confirm">${L("End and review feedback","Terminar y revisar feedback")}</button>`)}
document.addEventListener("keydown",e=>{const m=layer.querySelector(".modal");if(m){if(e.key==="Escape"){closeModal();return}if(e.key==="Tab"){const f=[...m.querySelectorAll("button,input,select,textarea,a[href]")];const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}
 if(e.key==="Enter"&&e.target.id==="gs"){const q=e.target.value.toLowerCase().trim();const M=[[/curso|course|learn|aprend|wcag|lecci|lesson|foco|focus/,"learn"],[/tester|marta|javier|ana|daniel|luc|omar|conect|connect/,"connect"],[/proyect|project|clinica-norte|farmacia|ritmo|museo/,"projects"],[/check|contraste|contrast|figma|anali|revis/,"check"],[/sesi|session|agenda/,"sessions"],[/feedback|problem|issue|insight/,"feedback"],[/perfil|profile|insignia|badge/,"profile"]];const hit=q&&M.find(([r])=>r.test(q));if(hit){location.hash=hit[1]}else toast(L(`No results for “${q}”`,`Sin resultados para “${q}”`))}});
document.addEventListener("input",e=>{if(e.target.id==="pq"){S.pq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("pq");n.focus();n.setSelectionRange(pos,pos);return}if(e.target.id==="ts"){S.tq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("ts");n.focus();n.setSelectionRange(pos,pos)}});

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,[data-close]");if(!t)return;const d=t.dataset;
  if(d.lang){S.lang=d.lang;try{localStorage.setItem("lk-lang",S.lang)}catch(_){}render();document.querySelector(`[data-lang="${S.lang}"]`)?.focus();return}
  if(t.hasAttribute("data-close")){closeModal();return}
  if(d.act==="mk-project"){const i=document.getElementById("mn"),v=i.value.trim();if(!v){i.classList.add("is-error");i.setAttribute("aria-invalid","true");const er=document.getElementById("mn-e");er.className="help err";er.textContent=L("Give your project a name.","Ponle un nombre al proyecto.");i.focus();return}S.extra.push({id:"x"+S.extra.length,n:v,sc:0,st:L("Draft","Borrador"),stk:"low",ts:0,la:L("Just now","Ahora mismo")});layer.innerHTML="";location.hash="projects";render(true);toast(L("Project created. Run a first check.","Proyecto creado. Haz un primer check."));return}
  if(d.act==="send-invite"){const n=d.who,tt=TESTERS().find(x=>x.n===n);S.invited.add(n);S.scheduled.push({n,i:tt.i,c:tt.c,p:document.getElementById("iv-p").value,when:document.getElementById("iv-d").value+" · "+document.getElementById("iv-t").value});layer.innerHTML="";render();document.querySelector(`[data-inv="${n}"]`)?.focus();toast(L(`Invitation sent to ${n}. See it in Sessions.`,`Invitación enviada a ${n}. La verás en Sesiones.`));return}
  if(d.act==="end-confirm"){S.ended=true;layer.innerHTML="";location.hash="feedback";toast(L("Session ended · 10 pts sent to Javier","Sesión terminada · 10 pts enviados a Javier"));return}
  if(d.act==="endsession"){endModal();return}
  if(t.hasAttribute("data-viewas")){S.role=S.role==="tester"?"designer":"tester";location.hash=S.role==="tester"?"tester":"home";return}
  if(d.demo){S.role=d.demo;S.logged=true;location.hash=d.demo==="tester"?"tester":"home";return}
  if(t.hasAttribute("data-social")){S.logged=true;toast(L("Connected. Welcome!","Conectado. ¡Bienvenida!"));const nx=S.route==="signup"?"onboarding":(S.role==="tester"?"tester":"home");setTimeout(()=>location.hash=nx,600);return}
  if(t.hasAttribute("data-forgot")){document.getElementById("li-msg").innerHTML=`<div class="alert alert-ok" role="status">${I("ok")}<div><b>${L("Check your inbox","Revisa tu correo")}</b><p class="small">${L("We have sent a reset link to your email.","Te hemos enviado un enlace para restablecerla.")}</p></div></div>`;return}
  if(d.cancel){S.scheduled=S.scheduled.filter(x=>x.n!==d.cancel);S.invited.delete(d.cancel);render();toast(L("Invitation cancelled","Invitación cancelada"));return}

  let keep=null;
  if(d.cat){S.courseCat=d.cat;keep=`[data-cat="${d.cat}"]`}
  else if(d.q!==undefined){S.quiz=+d.q;keep=`[data-q="${d.q}"]`}
  else if(d.act==="next-lesson"){toast(L("Lesson complete · +40 XP","Lección completada · +40 XP"));S.quiz=null;location.hash="learn";return}
  else if(d.ctab){S.checkTab=d.ctab;keep=`[data-ctab="${d.ctab}"]`}
  else if(d.issue!==undefined){S.openIssue=S.openIssue===+d.issue?-1:+d.issue;keep=`[data-issue="${d.issue}"]`}
  else if(d.ptab){S.projTab=d.ptab;keep=`[data-ptab="${d.ptab}"]`}
  else if(d.f){S.filters.has(d.f)?S.filters.delete(d.f):S.filters.add(d.f);keep=`[data-f="${d.f}"]`}
  else if(d.inv){if(!S.invited.has(d.inv))invModal(d.inv);return}
  else if(d.act==="runcheck"){runCheck();return}
  else if(d.ptopic){S.ptopic=d.ptopic;keep=`[data-ptopic="${d.ptopic}"]`}
  else if(d.palt!==undefined){S.palt=+d.palt;keep=`[data-palt="${d.palt}"]`}
  else if(d.pal){[S.fg,S.bg]=d.pal.split("|");keep=`[data-pal="${d.pal}"]`}
  else if(d.delnote!==undefined){S.notes.splice(+d.delnote,1);keep="#nt"}
  else if(d.ctmode){S.ct.mode=d.ctmode;saveCt();keep=`[data-ctmode="${d.ctmode}"]`}
  else if(d.cttype2){saveCt();S.ct.type=d.cttype2;keep=`[data-cttype2="${d.cttype2}"]`}
  else if(d.tip!==undefined){saveCt();S.tip=S.tip===+d.tip?null:+d.tip;keep=`[data-tip="${d.tip}"]`}
  else if(d.ct){const c=S.ct;if(d.ct==="next"){saveCt();if(!c.type||!c.name||!c.q){c.err=true;render();document.querySelector('[role="alert"]')?.scrollIntoView({block:"center"});(document.getElementById(!c.type?"s2":!c.name?"ctn":"ctq")||{}).focus?.();return}c.err=false;c.step=2;render(true);return}
    if(d.ct==="back"){saveCt2();c.step=1;render(true);return}
    if(d.ct==="create"){saveCt2();if(!S.ctDates.size||!S.ctTimes.size){c.err2=true;render();document.querySelector('[role="alert"]')?.scrollIntoView({block:"center"});return}c.err2=false;const tl={ui:L("User interface","Interfaz de usuario"),a11y:L("Accessibility","Accesibilidad"),content:L("Content","Contenido")}[c.type];S.created.push({id:"c"+S.created.length,name:c.name,proj:"Clínica Norte",typeL:tl,days:c.total});c.step=3;render(true);document.getElementById("ctdone")?.focus();toast(L("Test created","Test creado"));return}}
  else if(d.calm){const [k,n]=d.calm.split(":");S.calm[k]=Math.max(0,Math.min(2,(S.calm[k]||0)+ +n));if(k==="ctDates")saveCt2();keep=`[data-calm="${d.calm}"]`}
  else if(d.calset){const [k,n]=d.calset.split(":");S.calm[k]=+n;keep=`[data-calset="${d.calset}"]`}
  else if(d.cday){const [k,v]=d.cday.split(":");if(k==="ctDates")saveCt2();S[k].has(v)?S[k].delete(v):S[k].add(v);keep=`[data-cday="${d.cday}"]`}
  else if(d.ts){const [k,...r]=d.ts.split(":");const v=r.join(":");if(k==="ctTimes")saveCt2();S[k].has(v)?S[k].delete(v):S[k].add(v);keep=`[data-ts="${d.ts}"]`}
  else if(d.pt2){S.ptopic2=S.ptopic2===d.pt2?null:d.pt2;keep=`[data-pt2="${d.pt2}"]`}

  else if(d.ntab){S.ntab=d.ntab;keep=`[data-ntab="${d.ntab}"]`}
  else if(d.mark!==undefined){const n=S.notes2[+d.mark];n.mark=!n.mark;keep=`[data-mark="${d.mark}"]`}
  else if(d.thread!==undefined){S.thread=+d.thread;keep="#mi"}
  else if(d.tjoin){S.tjoin[d.tjoin]=1;toast(L("Joined. It is now in progress.","Te has unido. Ya está en curso."));keep="#mt-run"}

  else if(d.onb){const [k,id,m]=d.onb.split(":");const cur=S.onbA[k]||[];S.onbA[k]=m==="1"?(cur.includes(id)?cur.filter(x=>x!==id):cur.concat(id)):[id];keep=`[data-onb="${d.onb}"]`}
  else if(d.onbnav){S.onb=Math.max(0,S.onb+ +d.onbnav);render();document.getElementById("oq")?.focus();return}
  else if(d.tinv){const [k,v]=d.tinv.split(":");S.tInv[k]=v||undefined;if(v==="ok")toast(L("Invitation accepted","Invitación aceptada"));keep=`[data-tinv^="${k}:"]`}

  else if(d.task!==undefined){S.task=+d.task;keep=`[data-task="${d.task}"]`}

 <section class="card"><h2 style="font-size:1.05rem;margin-bottom:8px">${L("How do they work?","¿Cómo funcionan?")}</h2><ul class="small stack" style="margin:0;padding-left:20px;gap:6px"><li>${L("Points earned from each test can be redeemed at different local stores.","Los puntos obtenidos de acuerdo a cada test podrán ser canjeados en diferentes establecimientos locales.")}</li><li>${L("The money example is only a reference and is not a real redemption promise at specific stores.","El ejemplo monetario es solo una referencia y no representa una promesa real de canje en comercios específicos.")}</li></ul></section>
 <section class="card"><h2 style="font-size:1.05rem;margin-bottom:8px">${L("Points equivalence","Equivalencia de los puntos")}</h2><p style="margin:0;color:var(--cobalt);font-weight:600;font-style:italic">${L("1 point = local currency (e.g. €1.00)","1 punto = moneda local (ejemplo €1,00)")}</p><p class="xs muted" style="margin:4px 0 0">${L("Illustrative equivalence. Not a redemption offer.","Equivalencia ilustrativa: 1 punto = 1 € de moneda local. No implica una oferta de canje.")}</p></section>
 <section class="card"><div class="row between" style="margin-bottom:6px"><h2 style="font-size:1.05rem">${L("My points","Mis puntos")}</h2><span class="pill">• ${L("Points history","Historial de puntos")}</span></div><ul class="list" style="list-style:none;margin:0;padding:0">${[["Test #1","25 pts"],["Test #2",L("Pending","Pendiente")],["Test #3",L("Pending","Pendiente")],["Test #4",L("Pending","Pendiente")]].concat(S.redeemed?[[L("Redeemed","Canjeado"),"−30 pts"]]:[]).map(([a,b])=>`<li class="row between" style="padding:12px 0"><span class="small">${a}</span><b class="small ${b.includes("pts")?"num":"muted"}">${b}</b></li>`).join("")}</ul><div class="hint row between" style="margin-top:8px"><div><span class="xs muted">${L("Total","Total acumulado")}</span><div class="num" style="font-size:1.6rem;font-weight:800">${pts} pts</div></div>${I("star")}</div></section>
 <section class="remind row" style="gap:14px"><span class="av" style="background:#fff;color:var(--cobalt)">${I("ok")}</span><div style="flex:1;min-width:0"><b>${L("Remember: minimum of 30 pts","Recuerda: mínimo de 30 pts")}</b><p class="small" style="margin:2px 0 0;opacity:.9">${L("You can only redeem your points with a minimum of 30 pts.","Recuerda: sólo puedes canjear tus puntos con un mínimo de 30 pts.")}</p></div><button class="btn btn-sm" style="background:#fff;color:var(--cobalt)" data-act="redeem" ${pts>=30?"":'disabled aria-disabled="true"'}>${L("Redeem","Canjear")}</button></section>
 <section class="card row" style="gap:20px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><h2 style="font-size:1.05rem">${L("Redemption example","Ejemplo de canje")}</h2><p class="small muted" style="margin:4px 0 0">${L("Check the balance and redemption conditions when you reach the minimum of 30 points.","Consulta el saldo y las condiciones de canje cuando alcances el mínimo de 30 puntos.")}</p></div>${MASC(160)}</section></div>`)};

/* tester sign-up, pending, welcome */
V.pending=()=>`<div class="lnd">${header()}<main id="main" tabindex="-1" class="lw" style="padding-block:40px 64px"><span class="pill" style="margin-bottom:14px">• ${L("Registration confirmation","Confirmación de registro")}</span>
 <div class="g" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start"><div class="stack"><h1 class="disp" style="font-size:clamp(2rem,4vw,2.8rem)">${L("Almost there, Adriana!","¡Casi listo, Adriana!")}</h1><p class="muted" style="margin:0">${L("Your request is under review. Our team is checking the information you provided to activate your access to the tester community.","Tu solicitud ya está en revisión. En este momento, nuestro equipo verifica la información proporcionada para activar tu acceso a la comunidad de testers.")}</p>
 <div class="card stack"><div class="row between" style="flex-wrap:wrap"><b class="row">${I("ok")} ${L("Request sent","Solicitud enviada")}</b><span class="sev sev-medium">● ${L("Pending review","Pendiente de revisión")}</span></div><div class="g g2" style="gap:12px"><div><span class="xs muted">${L("Confirmation email","Correo de confirmación")}</span><div style="font-weight:700">adriana@linkers.app</div></div><div><span class="xs muted">${L("Estimated time","Plazo estimado")}</span><div style="font-weight:700">${L("Up to 24 hours","Máximo 24 horas")}</div></div></div><p class="small muted" style="margin:0">${L("You will receive a confirmation email within that time. If you need to update your data, you can go back and edit your profile before it is activated.","Recibirás un correo electrónico de confirmación en el plazo indicado. Si necesitas actualizar tus datos, puedes regresar y editar tu perfil antes de que se active tu acceso.")}</p></div>
 <h2 style="font-size:1rem">${L("Next steps","Siguiente paso")}</h2><ol class="stack" style="list-style:none;margin:0;padding:0;gap:8px">${[L("We review your request and validate the information.","Revisamos tu solicitud y validamos la información proporcionada."),L("We send you a confirmation email with instructions to activate your account.","Te enviamos un correo de confirmación con instrucciones para activar tu cuenta."),L("Once activated, you can join the community, review available tests and take part.","Una vez activada, podrás acceder a la comunidad, revisar testeos disponibles y participar en la mejora de la accesibilidad.")].map((x,i)=>`<li class="hint row" style="align-items:flex-start"><b class="num">${i+1}</b><span class="small">${x}</span></li>`).join("")}</ol>
 <div class="row" style="flex-wrap:wrap"><a class="btn btn-s" href="#signup">← ${L("Back","Regresar")}</a><button class="btn btn-p" data-act="activate">${L("Log in","Iniciar sesión")}</button><span class="xs muted">${L("Prototype: simulates the account being activated.","Prototipo: simula que la cuenta ya se ha activado.")}</span></div></div>
 <aside class="stack"><div class="card stack" style="gap:8px"><div class="row between"><span class="pill">Tester</span><span class="xs muted">${L("Pending review","Pendiente de revisión")}</span></div><b style="font-size:1.1rem">Adriana Arciniega</b><p class="small muted" style="margin:0">${L("Your profile is ready to be reviewed by our team. Once active you can start taking part in tests.","Tu perfil está listo para ser revisado por nuestro equipo. En cuanto se active tu acceso, podrás comenzar a participar en testeos.")}</p></div><div class="card stack"><span class="xs muted">${L("Process illustration","Ilustración de proceso")}</span>${MASC(300)}</div></aside></div></main>${footerPub()}</div>`;
V.welcome=()=>`<div class="lnd">${header()}<main id="main" tabindex="-1" class="lw" style="padding-block:64px"><div class="g g2" style="align-items:center;gap:48px"><div><span class="pill">• ${L("Welcome, tester","Bienvenida, tester")}</span><h1 class="disp" style="font-size:clamp(2rem,4vw,2.8rem);margin:16px 0 10px">${L("Welcome aboard","Te damos la bienvenida")}</h1><p class="muted" style="margin:0 0 24px;max-width:46ch">${L("Bring your experience to improve the accessibility of products and services. From your summary you can see your tests, next sessions and points.","Aporta tu experiencia para mejorar la accesibilidad de productos y servicios. Desde tu resumen puedes consultar tus tests, próximas sesiones y puntos.")}</p><div class="row" style="flex-wrap:wrap"><a class="btn btn-p" href="#tester">${L("Go to my summary","Ir a mi resumen")} ${I("arrow")}</a><a class="btn btn-s" href="#discover">${L("See available tests","Ver test disponibles")}</a></div></div>
<figure style="margin:0;border-radius:20px;overflow:hidden;box-shadow:var(--sh-2);aspect-ratio:4/3;max-width:100%"><img src="${IMG.t}" alt="${L("Hands of a tester holding a phone while testing an app","Manos de un tester sosteniendo un móvil mientras prueba una app")}" style="width:100%;height:100%;object-fit:cover;display:block"></figure></div></main>${footerPub()}</div>`;
function infoModal(){modal(L("Important information","Información importante"),`<p class="small muted" style="margin:0">${L("Before continuing, review what data we need to personalise your experience, validate your profile and protect your data.","Antes de continuar, revisa qué datos necesitamos para personalizar tu experiencia, validar tu perfil y proteger tus datos.")}</p>${[[L("Step 1","Paso 1"),L("Type of disability","Tipo de discapacidad"),L("It helps us personalise the process and lets the algorithm match you with suitable prototypes.","Nos ayuda a personalizar el proceso y que el algoritmo te asigne los prototipos adecuados para tu perfil.")],[L("Step 2","Paso 2"),L("Disability certificate","Certificado de discapacidad"),L("It verifies your situation so you receive the right support during the process.","Verifica tu condición y asegura que recibes la atención adecuada durante el proceso.")],[L("Step 3","Paso 3"),L("ID document (DNI)","DNI (Documento Nacional de Identidad)"),L("It confirms your identity and protects your account.","Confirma tu identidad y garantiza la seguridad y protección de tus datos.")]].map(([a,b,c])=>`<div class="hint"><span class="xs muted">${a}</span><b style="display:block">${b}</b><span class="small">${c}</span></div>`).join("")}<div class="hint" style="background:var(--cobalt-l)"><b>${L("Data protection","Protección de datos")}</b><p class="small" style="margin:4px 0 0">${L("Your data is treated confidentially and used only for these purposes, in line with GDPR. Documents are deleted after verification.","Tus datos se tratan de manera confidencial y se usan exclusivamente para estos fines, conforme al RGPD. Los documentos se eliminan tras la verificación.")}</p></div>`,`<button class="btn btn-p" data-close>${L("Understood","Entendido")}</button>`)}

/* accessibility panel (proposal) */
const AP=()=>[["visual",L("Visual disability","Discapacidad visual")],["motor",L("Motor skill disorders","Trastornos de habilidades motoras")],["dalt",L("Colour blindness","Daltonismo")],["epi",L("Epilepsy","Epilepsia")],["tdah",L("ADHD","TDAH")],["dys",L("Dyslexia","Dislexia")],["contrast",L("Contrast","Contraste")],["links",L("Links underline","Links Underline")]];
function a11yFab(){const onoff=(k,t)=>`<li class="aprow"><span id="ap-${k}">${t}</span><button class="onoff" role="switch" aria-checked="${!!S.ap[k]}" aria-labelledby="ap-${k}" data-ap="${k}"><span class="${S.ap[k]?"":"cur"}">Off</span><span class="${S.ap[k]?"cur":""}">On</span></button></li>`;
 const tools=[["sr","conn",L("Screen reader","Lector de pantalla")],["kbd","proj",L("Keyboard navigation","Navegación por teclado")],["zoom","search","Zoom"]];
 return `<div class="fab"><button class="fab-b" aria-expanded="${S.a11y}" aria-controls="fab-p" data-act="a11y" aria-label="${L("Accessibility tools","Herramientas de accesibilidad")}"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true" style="width:26px;height:26px"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7" r="1.4" fill="currentColor"/><path d="M7 10l5 1 5-1M12 11v4l-2.5 4M12 15l2.5 4"/></svg></button>${S.a11y?`<div id="fab-p" class="appanel" role="dialog" aria-label="${L("Accessibility tools","Herramientas de accesibilidad")}"><div class="aph"><div><span class="xs" style="opacity:.85">${L("Accessibility panel","Panel de accesibilidad")}</span><h2 style="font-size:1.1rem;color:#fff">${L("Accessibility tools","Herramientas de accesibilidad")}</h2></div><button class="apx" data-act="a11y" aria-label="${L("Close","Cerrar")}">${I("x")}</button></div>
 <div class="apb"><div class="hint"><span class="xs" style="color:var(--cobalt);font-weight:700">${L("Accessibility profiles","Perfiles de accesibilidad")}</span><b style="display:block;font-size:1.05rem">${L("Set up the experience for each user","Configura la experiencia según el usuario")}</b><span class="xs muted">${L("Choose a profile to turn on related tools.","Selecciona un perfil para activar herramientas relacionadas.")}</span></div>
 <div class="row between small"><b>${L("Profiles","Perfiles")}</b><span class="muted">8 ${L("profiles","perfiles")}</span></div><ul class="stack" style="list-style:none;margin:0;padding:0;gap:6px">${AP().map(([k,t])=>onoff(k,t)).join("")}</ul>
 <div class="row between small"><b>${L("Tools","Herramientas")}</b><span class="muted">3 ${L("tools","herramientas")}</span></div><div class="g" style="grid-template-columns:repeat(3,1fr);gap:8px">${tools.map(([k,ic,t])=>`<button class="aptool ${S.ap[k]?"on":""}" aria-pressed="${!!S.ap[k]}" data-ap="${k}">${I(ic)}<span>${t}</span></button>`).join("")}</div>
 <div class="g g2" style="gap:8px"><button class="btn btn-s" data-act="ap-reset">${L("Reset","Restablecer")}</button><button class="btn btn-p" data-act="a11y">${I("x")} ${L("Close","Cerrar")}</button></div><a class="btn btn-s" href="#landing" style="width:100%">${L("Back to home","Volver al inicio")}</a></div></div>`:""}</div>`}
function applySet(){const h=document.documentElement,a=S.ap,s=S.set;h.style.setProperty("--fs",(a.zoom?20:(s.large||a.visual)?19:16)+"px");h.classList.toggle("rm",!!(s.rm||a.epi||a.tdah));h.classList.toggle("legible",!!(s.legible||a.dys));h.classList.toggle("hc",!!(s.hc||a.contrast||a.visual||a.dalt));h.classList.toggle("ul",!!(a.links||a.dalt));h.classList.toggle("big",!!a.motor);h.classList.toggle("kbd",!!a.kbd);h.classList.toggle("dys",!!a.dys)}
function speak(){if(!S.ap.sr)return;try{const t=(document.querySelector("#main h1")||{}).textContent;if(t&&window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang==="es"?"es-ES":"en-GB";speechSynthesis.speak(u)}}catch(e){}}

function saveCt(){const c=S.ct,g=id=>document.getElementById(id);if(g("ctn"))c.name=g("ctn").value.trim();if(g("ctu"))c.target=g("ctu").value;if(g("ctdsc"))c.desc=g("ctdsc").value;if(g("ctq"))c.q=g("ctq").value;if(g("ctr"))c.reward=g("ctr").value;if(c.type&&c.name&&c.q)c.err=false}
function saveCt2(){const c=S.ct,g=id=>document.getElementById(id);if(g("ct-h"))c.h=g("ct-h").value;if(g("ct-m"))c.m=g("ct-m").value}

go();
</script>

</body>
</html>
